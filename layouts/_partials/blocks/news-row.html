{{- $page := .page -}}
{{- $category := partial "news/category.html" $page -}}
<article class="news-row"><time datetime="{{ $page.Date.Format "2006-01-02" }}">{{ $page.Date.Format "2006.01.02" }}</time><span class="news-category" data-category="{{ $category.style }}">{{ $category.label }}</span><h3><a href="{{ $page.RelPermalink }}">{{ $page.Title }} <span aria-hidden="true">→</span></a></h3></article>
