<section class="news-section section-wash" aria-labelledby="{{ .id }}"><div class="container">
  <div class="section-heading"><div><p class="eyebrow">{{ .eyebrow }}</p><h2 id="{{ .id }}">{{ .title }}</h2></div>{{ with .link }}<a class="text-link" href="{{ partialCached "site-url.html" . . site.BaseURL }}">{{ $.linkLabel }} <span aria-hidden="true">→</span></a>{{ end }}</div>
  <div class="news-table">{{ range .entries }}{{ partial "blocks/news-row.html" (dict "page" . "defaultCategory" $.defaultCategory) }}{{ end }}</div>
</div></section>
