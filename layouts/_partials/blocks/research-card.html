<article class="research-card">{{ with .Params.image }}<a class="research-image" href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true"><img src="{{ partialCached "site-url.html" . . site.BaseURL }}" alt="" width="700" height="526" loading="lazy"></a>{{ end }}<div class="research-copy">{{ with .Params.category }}<p class="research-category">{{ . }}</p>{{ end }}<h3><a href="{{ .RelPermalink }}">{{ .Title }} <span aria-hidden="true">→</span></a></h3>{{ with .Description }}<p>{{ . }}</p>{{ end }}</div></article>
