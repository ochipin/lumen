<section class="research-section section-wash" aria-labelledby="{{ .id }}"><div class="container">
  <div class="section-heading"><div>{{ with .eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}<h2 id="{{ .id }}">{{ .title }}</h2></div>{{ with .link }}<a class="text-link" href="{{ partialCached "site-url.html" . . site.BaseURL }}">{{ $.linkLabel }} <span aria-hidden="true">→</span></a>{{ end }}</div>
  {{ with .body }}<div class="section-description">{{ . }}</div>{{ end }}
  <div class="research-grid">{{ range .entries }}{{ partial "blocks/research-card.html" . }}{{ end }}</div>
</div></section>
